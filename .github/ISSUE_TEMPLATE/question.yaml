name: ❓ Question or Discussion
description: Ask questions or start discussions about codestrike
title: "[Question]: "
labels: ["question"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for your interest in codestrike! 🚀

        We're here to help answer your questions.

  - type: checkboxes
    id: checks
    attributes:
      label: Initial Checks
      description: Just making sure you've checked the basics first.
      options:
        - label: I searched existing issues and discussions
          required: true
        - label: I checked the README and documentation
          required: true

  - type: dropdown
    id: question_type
    attributes:
      label: Question Type
      description: What kind of help do you need?
      options:
        - Installation and setup
        - Configuration and authentication
        - VCS integration (GitHub/GitLab/BitBucket/Codeberg)
        - LLM backend configuration
        - CLI usage (review/serve commands)
        - System prompt customization
        - Performance and troubleshooting
        - Development and contributing
        - Best practices
        - Other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: |
        What would you like to know?

        Please be as specific as possible so we can give you the best help. 🙏
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context (Optional)
      description: |
        Any additional context that might help us understand your situation?

        Your use case, setup, or what you're trying to achieve.
      placeholder: |
        I'm trying to...
        My setup is...
        I've already tried...

  - type: textarea
    id: environment
    attributes:
      label: Environment (Optional)
      description: |
        If relevant, please share basic environment information.

        **Please don't include API tokens/keys or other sensitive information!**
      placeholder: |
        - Installation method: go install/docker/source
        - Go version: 1.26
        - Operating System: macOS/Windows/Linux
        - VCS platform: GitHub/GitLab/BitBucket/Codeberg
        - LLM backend: OpenAI-compatible endpoint
      render: text
