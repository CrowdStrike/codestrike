name: 🐛 Bug Report
description: Report a bug or unexpected behavior in codestrike
title: "[Bug]: "
labels: ["bug", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue to codestrike! 🚀

  - type: checkboxes
    id: checks
    attributes:
      label: Initial Checks
      description: Just making sure you're using the latest version and searched existing issues.
      options:
        - label: I confirm that I'm using the latest version of codestrike
          required: true
        - label: I searched existing issues before opening this report
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: |
        Please explain what you're seeing and what you expected to see.

        Include any error messages or unexpected behavior. 🙏
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        How can we reproduce this issue? Please be as specific as possible.
      placeholder: |
        1. Run `codestrike review <pr-url>` with...
        2. Configure the LLM backend as...
        3. Observe error...
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation Method
      description: How did you install codestrike?
      options:
        - go install
        - Docker container
        - Built from source (git clone)
        - Other (please specify in description)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: |
        Please share relevant environment information.

        **Please don't include API tokens/keys or other sensitive information!**
      placeholder: |
        - codestrike version: v0.1.0
        - Go version: 1.26
        - Operating System: macOS 14.1
        - VCS platform: GitHub
        - LLM backend: OpenAI-compatible endpoint (e.g. OPENAI_BASE_URL)
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs (Optional)
      description: |
        If you have error logs, please include them here.

        **Important: Remove any sensitive information like API keys or tokens before pasting!**
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional Context (Optional)
      description: |
        Anything else that might help us understand the issue?

        Screenshots, configuration files, or related issues are helpful!
