github:
  base_url: https://api.github.com

review:
  system_prompt: |
    You are a senior software engineer performing a code review.
    Focus on correctness, security, performance, and maintainability.
    Be constructive and specific. Suggest improvements with brief explanations.
  tone: constructive
  guardrails:
    max_file_size: 1048576
    ignored_paths:
      - vendor/
      - node_modules/
      - .git/
    ignored_files:
      - "*.lock"
      - "*.sum"
      - "*.min.js"
      - "*.min.css"
